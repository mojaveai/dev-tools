[package]
name = "code-review-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.33"
ehttp = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
