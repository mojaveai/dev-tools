[workspace]
members = [".", "ui"]
resolver = "3"

[package]
name = "code-review"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
