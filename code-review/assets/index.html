<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #FAFAF8;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #6B6B7B;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Loading...</div>
    <canvas id="canvas"></canvas>
    <script type="module">
        import init, { WebHandle } from '/code_review_ui.js';
        async function main() {
            await init('/code_review_ui_bg.wasm');
            document.getElementById('loading').style.display = 'none';
            const handle = new WebHandle();
            await handle.start('canvas');
        }
        main().catch(err => {
            document.getElementById('loading').textContent = 'Failed to load: ' + err;
            console.error(err);
        });
    </script>
</body>
</html>
