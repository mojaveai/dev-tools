---
- name: Create agent skill parent
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/{{ skill_target | dirname }}"
    state: directory
    mode: '0755'

- name: Inspect installed skill
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/{{ skill_target }}"
    follow: false
  register: installed_skill

- name: Back up standalone skill before adoption
  ansible.builtin.command:
    argv:
      - mv
      - "{{ ansible_facts.user_dir }}/{{ skill_target }}"
      - "{{ ansible_facts.user_dir }}/{{ skill_target }}.pre-ansible-{{ ansible_facts.date_time.epoch }}"
  when: installed_skill.stat.exists and not installed_skill.stat.islnk

- name: Link skill to managed release
  ansible.builtin.file:
    src: "{{ devtools_home }}/skills/{{ skill_target | basename }}"
    dest: "{{ ansible_facts.user_dir }}/{{ skill_target }}"
    state: link
    force: true
  when: not ansible_check_mode
